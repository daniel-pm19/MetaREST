name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  publish-and-deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/metarest-backend:${{ github.event.workflow_run.head_sha }}
            ghcr.io/${{ env.OWNER }}/metarest-backend:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/frontend.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/metarest-frontend:${{ github.event.workflow_run.head_sha }}
            ghcr.io/${{ env.OWNER }}/metarest-frontend:latest
      - name: Update host
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          TARGET: ${{ secrets.EC2_SSH_TARGET }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$TARGET"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/deploy_key"' EXIT
          scp -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes infra/docker-compose.prod.yml "$TARGET:/opt/metarest/infra/docker-compose.prod.yml"
          scp -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes infra/nginx/prod.conf.template "$TARGET:/opt/metarest/infra/nginx/prod.conf.template"
          ssh -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes "$TARGET" \
            "cd /opt/metarest && export IMAGE_TAG='$IMAGE_TAG' && docker compose --env-file .env -f infra/docker-compose.prod.yml pull && docker compose --env-file .env -f infra/docker-compose.prod.yml up -d --wait"
