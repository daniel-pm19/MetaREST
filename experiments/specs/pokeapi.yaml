          description: The name of this resource listed in different languages.
        pokemon:
          type: array
          items:
            $ref: '#/components/schemas/TypePokemon'
          readOnly: true
          description: A list of details of Pokémon that have this type.
        moves:
          type: array
          items:
            $ref: '#/components/schemas/MoveSummary'
          readOnly: true
          description: A list of moves that have this type.
        sprites:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/TypeGameSprite'
          readOnly: true
          description: Type icons grouped by generation and game, with name_icon and symbol_icon URLs. Unavailable icons are
            null.
      required:
      - damage_relations
      - game_indices
      - generation
      - id
      - move_damage_class
      - moves
      - name
      - names
      - past_damage_relations
      - pokemon
      - sprites
    TypeGameIndex:
      type: object
      properties:
        game_index:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: The internal id of an API resource within game data.
        generation:
          allOf:
          - $ref: '#/components/schemas/GenerationSummary'
          description: The generation relevent to this game index.
      required:
      - game_index
      - generation
    TypeGameSprite:
      type: object
      properties:
        name_icon:
          type:
          - string
          - 'null'
          description: The URL of the icon displaying the type name in this game, or null if unavailable.
        symbol_icon:
          type:
          - string
          - 'null'
          description: The URL of the type symbol icon in this game, or null if unavailable.
    TypeName:
      type: object
      properties:
        name:
          type: string
          description: The localized name for an API resource in a specific language.
          maxLength: 200
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageSummary'
          description: The language this name is in.
      required:
      - language
      - name
    TypePastRelationships:
      type: object
      properties:
        generation:
          allOf:
          - $ref: '#/components/schemas/GenerationSummary'
          description: The last generation in which the referenced type had the listed damage relations
        damage_relations:
          allOf:
          - $ref: '#/components/schemas/TypeRelationships'
          description: The damage relations the referenced type had up to and including the listed generation
      required:
      - damage_relations
      - generation
    TypePokemon:
      type: object
      properties:
        slot:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: The order the Pokémon's types are listed in.
        pokemon:
          allOf:
          - $ref: '#/components/schemas/PokemonSummary'
          description: The Pokémon that has the referenced type.
      required:
      - pokemon
      - slot
    TypeRelationships:
      type: object
      properties:
        no_damage_to:
          type: array
          items:
            $ref: '#/components/schemas/TypeSummary'
          description: A list of types this type has no effect on.
        half_damage_to:
          type: array
          items:
            $ref: '#/components/schemas/TypeSummary'
          description: A list of types this type is not very effect against.
        double_damage_to:
          type: array
          items:
            $ref: '#/components/schemas/TypeSummary'
          description: A list of types this type is very effect against.
        no_damage_from:
          type: array
          items:
            $ref: '#/components/schemas/TypeSummary'
          description: A list of types that have no effect on this type.
        half_damage_from:
          type: array
          items:
            $ref: '#/components/schemas/TypeSummary'
          description: A list of types that are not very effective against this type.
        double_damage_from:
          type: array
          items:
            $ref: '#/components/schemas/TypeSummary'
          description: A list of types that are very effective against this type.
      required:
      - double_damage_from
      - double_damage_to
      - half_damage_from
      - half_damage_to
      - no_damage_from
      - no_damage_to
    TypeSummary:
      type: object
      properties:
        name:
          type: string
          description: The name of the referenced resource.
          maxLength: 200
        url:
          type: string
          format: uri
          readOnly: true
          description: The URL of the referenced resource.
      required:
      - name
      - url
    VersionGroupSummary:
      type: object
      properties:
        name:
          type: string
          description: The name of the referenced resource.
          maxLength: 200
        url:
          type: string
          format: uri
          readOnly: true
          description: The URL of the referenced resource.
      required:
      - name
      - url
    VersionSummary:
      type: object
      properties:
        name:
          type: string
          description: The name of the referenced resource.
          maxLength: 200
        url:
          type: string
          format: uri
          readOnly: true
          description: The URL of the referenced resource.
      required:
      - name
      - url
servers:
- url: https://pokeapi.co
tags:
- name: pokemon
  description: Pokémon are the creatures that inhabit the world of the Pokémon games. They can be caught using Pokéballs and
    trained by battling with other Pokémon. Each Pokémon belongs to a specific species but may take on a variant which makes
    it differ from other Pokémon of the same species, such as base stats, available abilities and typings. See [Bulbapedia](http://bulbapedia.bulbagarden.net/wiki/Pok%C3%A9mon_(species))
    for greater detail.
  externalDocs:
    description: Find more info here
    url: https://bulbapedia.bulbagarden.net/wiki/Pok%C3%A9mon
- name: evolution
  description: Evolution is a process in which a Pokémon changes into a different species of Pokémon.
  externalDocs:
    description: Find more info here
    url: https://bulbapedia.bulbagarden.net/wiki/Evolution
- name: berries
  description: Berries can be soft or hard. Check out [Bulbapedia](http://bulbapedia.bulbagarden.net/wiki/Category:Berries_by_firmness)
    for greater detail.
  externalDocs:
    description: Find more info here
    url: https://bulbapedia.bulbagarden.net/wiki/Berry
- name: items
  description: An item is an object in the games which the player can pick up, keep in their bag, and use in some manner.
    They have various uses, including healing, powering up, helping catch Pokémon, or to access a new area.
  externalDocs:
    description: Find more info here
    url: https://bulbapedia.bulbagarden.net/wiki/Item
- name: machines
  description: Machines are the representation of items that teach moves to Pokémon. They vary from version to version, so
    it is not certain that one specific TM or HM corresponds to a single Machine.
  externalDocs:
    description: Find more info here
    url: https://bulbapedia.bulbagarden.net/wiki/TM
- name: location
  description: Locations that can be visited within the games. Locations make up sizable portions of regions, like cities
    or routes.
  externalDocs:
    description: Find more info here
    url: https://bulbapedia.bulbagarden.net/wiki/List_of_locations_by_index_number
- name: contest
  description: Pokémon Contests are a type of competition often contrasted with Pokémon battles and held in Contest Halls
  externalDocs:
    description: Find more info here
    url: https://bulbapedia.bulbagarden.net/wiki/Pok%C3%A9mon_Contest
- name: moves
  description: Moves are the skills of Pokémon in battle. In battle, a Pokémon uses one move each turn. Some moves (including
    those learned by Hidden Machine) can be used outside of battle as well, usually for the purpose of removing obstacles
    or exploring new areas.
  externalDocs:
    description: Find more info here
    url: https://bulbapedia.bulbagarden.net/wiki/List_of_locations_by_name
- name: encounters
- name: games
  description: The Pokémon games are all video games in the Pokémon franchise.
  externalDocs:
    description: Find more info here
    url: https://bulbapedia.bulbagarden.net/wiki/Pok%C3%A9mon_games
- name: utility
externalDocs:
  url: https://pokeapi.co/docs/v2
security: []
