openapi: 3.1.0
info:
  title: PokéAPI
  version: 2.10.0
  description: 'All the Pokémon data you''ll ever need in one place, easily accessible through a modern free open-source RESTful
    API.


    ## What is this?


    This is a full RESTful API linked to an extensive database detailing everything about the Pokémon main game series.


    We''ve covered everything from Pokémon to Berry Flavors.


    ## Where do I start?


    We have awesome [documentation](https://pokeapi.co/docs/v2) on how to use this API. It takes minutes to get started.


    This API will always be publicly available and will never require any extensive setup process to consume.


    Created by [**Paul Hallett**](https://github.com/phalt) and other [**PokéAPI contributors**](https://github.com/PokeAPI/pokeapi#contributing)
    around the world. Pokémon and Pokémon character names are trademarks of Nintendo.'
paths:
  /api/v2/pokemon/:
    get:
      operationId: pokemon_list
      description: Pokémon are the creatures that inhabit the world of the Pokémon games. They can be caught using Pokéballs
        and trained by battling with other Pokémon. Each Pokémon belongs to a specific species but may take on a variant which
        makes it differ from other Pokémon of the same species, such as base stats, available abilities and typings. See [Bulbapedia](http://bulbapedia.bulbagarden.net/wiki/Pok%C3%A9mon_(species))
        for greater detail.
      summary: List pokemon
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - pokemon
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPokemonSummaryList'
          description: ''
  /api/v2/pokemon/{id}/:
    get:
      operationId: pokemon_retrieve
      description: Pokémon are the creatures that inhabit the world of the Pokémon games. They can be caught using Pokéballs
        and trained by battling with other Pokémon. Each Pokémon belongs to a specific species but may take on a variant which
        makes it differ from other Pokémon of the same species, such as base stats, available abilities and typings. See [Bulbapedia](http://bulbapedia.bulbagarden.net/wiki/Pok%C3%A9mon_(species))
        for greater detail.
      summary: Get pokemon
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: This parameter can be a string or an integer.
        required: true
        examples:
          '1':
            value: '1'
      tags:
      - pokemon
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PokemonDetail'
          description: ''
  /api/v2/pokemon-species/:
    get:
      operationId: pokemon_species_list
      description: A Pokémon Species forms the basis for at least one Pokémon. Attributes of a Pokémon species are shared
        across all varieties of Pokémon within the species. A good example is Wormadam; Wormadam is the species which can
        be found in three different varieties, Wormadam-Trash, Wormadam-Sandy and Wormadam-Plant.
      summary: List pokemon species
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - pokemon
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPokemonSpeciesSummaryList'
          description: ''
  /api/v2/pokemon-species/{id}/:
    get:
      operationId: pokemon_species_retrieve
      description: A Pokémon Species forms the basis for at least one Pokémon. Attributes of a Pokémon species are shared
        across all varieties of Pokémon within the species. A good example is Wormadam; Wormadam is the species which can
        be found in three different varieties, Wormadam-Trash, Wormadam-Sandy and Wormadam-Plant.
      summary: Get pokemon species
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: This parameter can be a string or an integer.
        required: true
        examples:
          '1':
            value: '1'
      tags:
      - pokemon
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PokemonSpeciesDetail'
          description: ''
  /api/v2/type/:
    get:
      operationId: type_list
      description: 'Types are properties for Pokémon and their moves. Each type has three properties: which types of Pokémon
        it is super effective against, which types of Pokémon it is not very effective against, and which types of Pokémon
        it is completely ineffective against.'
      summary: List types
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - pokemon
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTypeSummaryList'
          description: ''
  /api/v2/type/{id}/:
    get:
      operationId: type_retrieve
      description: 'Types are properties for Pokémon and their moves. Each type has three properties: which types of Pokémon
        it is super effective against, which types of Pokémon it is not very effective against, and which types of Pokémon
        it is completely ineffective against.'
      summary: Get types
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: This parameter can be a string or an integer.
        required: true
        examples:
          '1':
            value: '1'
      tags:
      - pokemon
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TypeDetail'
          description: ''
  /api/v2/ability/:
    get:
      operationId: ability_list
      description: Abilities provide passive effects for Pokémon in battle or in the overworld. Pokémon have multiple possible
        abilities but can have only one ability at a time. Check out [Bulbapedia](http://bulbapedia.bulbagarden.net/wiki/Ability)
        for greater detail.
      summary: List abilities
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - pokemon
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAbilitySummaryList'
          description: ''
  /api/v2/ability/{id}/:
    get:
      operationId: ability_retrieve
      description: Abilities provide passive effects for Pokémon in battle or in the overworld. Pokémon have multiple possible
        abilities but can have only one ability at a time. Check out [Bulbapedia](http://bulbapedia.bulbagarden.net/wiki/Ability)
        for greater detail.
      summary: Get ability
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: This parameter can be a string or an integer.
        required: true
        examples:
          '1':
            value: '1'
      tags:
      - pokemon
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbilityDetail'
          description: ''
  /api/v2/move/:
    get:
      operationId: move_list
      description: Moves are the skills of Pokémon in battle. In battle, a Pokémon uses one move each turn. Some moves (including
        those learned by Hidden Machine) can be used outside of battle as well, usually for the purpose of removing obstacles
        or exploring new areas.
      summary: List moves
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - moves
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMoveSummaryList'
          description: ''
  /api/v2/move/{id}/:
    get:
      operationId: move_retrieve
      description: Moves are the skills of Pokémon in battle. In battle, a Pokémon uses one move each turn. Some moves (including
        those learned by Hidden Machine) can be used outside of battle as well, usually for the purpose of removing obstacles
        or exploring new areas.
      summary: Get move
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: This parameter can be a string or an integer.
        required: true
        examples:
          '1':
            value: '1'
      tags:
      - moves
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveDetail'
          description: ''
  /api/v2/generation/:
    get:
      operationId: generation_list
      description: A generation is a grouping of the Pokémon games that separates them based on the Pokémon they include.
        In each generation, a new set of Pokémon, Moves, Abilities and Types that did not exist in the previous generation
        are released.
      summary: List genrations
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - games
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGenerationSummaryList'
          description: ''
  /api/v2/generation/{id}/:
    get:
      operationId: generation_retrieve
      description: A generation is a grouping of the Pokémon games that separates them based on the Pokémon they include.
        In each generation, a new set of Pokémon, Moves, Abilities and Types that did not exist in the previous generation
        are released.
      summary: Get genration
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: This parameter can be a string or an integer.
        required: true
        examples:
          '1':
            value: '1'
      tags:
      - games
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationDetail'
          description: ''
  /api/v2/berry/:
    get:
      operationId: berry_list
      description: Berries are small fruits that can provide HP and status condition restoration, stat enhancement, and even
        damage negation when eaten by Pokémon. Check out [Bulbapedia](http://bulbapedia.bulbagarden.net/wiki/Berry) for greater
        detail.
      summary: List berries
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - berries
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBerrySummaryList'
          description: ''
  /api/v2/berry/{id}/:
    get:
      operationId: berry_retrieve
      description: Berries are small fruits that can provide HP and status condition restoration, stat enhancement, and even
        damage negation when eaten by Pokémon. Check out [Bulbapedia](http://bulbapedia.bulbagarden.net/wiki/Berry) for greater
        detail.
      summary: Get a berry
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: This parameter can be a string or an integer.
        required: true
        examples:
          '1':
            value: '1'
      tags:
      - berries
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BerryDetail'
          description: ''
  /api/v2/pokemon/{pokemon_id}/encounters:
    get:
      operationId: pokemon_encounters_list
      description: Handles Pokemon Encounters as a sub-resource.
      summary: Get pokemon encounter
      parameters:
      - in: path
        name: pokemon_id
        schema:
          type: integer
        description: A unique integer value identifying the Pokémon.
        required: true
        examples:
          '1':
            value: 1
      tags:
      - encounters
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PokemonEncounterResponse'
          description: ''
components:
  schemas:
    AbilityChange:
      type: object
      properties:
        version_group:
          allOf:
          - $ref: '#/components/schemas/VersionGroupSummary'
          description: The version group in which the previous effect of this ability originated.
        effect_entries:
          type: array
          items:
            $ref: '#/components/schemas/AbilityChangeEffectText'
          readOnly: true
          description: The previous effect of this ability listed in different languages.
      required:
      - effect_entries
      - version_group
    AbilityChangeEffectText:
      type: object
      properties:
        effect:
          type: string
          description: The localized effect text for an API resource in a specific language.
          maxLength: 6000
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageSummary'
          description: The language this effect is in.
      required:
      - effect
      - language
    AbilityDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          description: The identifier for this resource.
        name:
          type: string
          description: The name for this resource.
          maxLength: 200
        is_main_series:
          type: boolean
          description: Whether or not this ability originated in the main series of the video games.
        generation:
          allOf:
          - $ref: '#/components/schemas/GenerationSummary'
          description: The generation this ability originated in.
        names:
          type: array
          items:
            $ref: '#/components/schemas/AbilityName'
          readOnly: true
          description: The name of this resource listed in different languages.
        effect_entries:
          type: array
          items:
            $ref: '#/components/schemas/AbilityEffectText'
          readOnly: true
          description: The effect of this ability listed in different languages.
        effect_changes:
          type: array
          items:
            $ref: '#/components/schemas/AbilityChange'
          readOnly: true
          description: The list of previous effects this ability has had across version groups.
        flavor_text_entries:
          type: array
          items:
            $ref: '#/components/schemas/AbilityFlavorText'
          readOnly: true
          description: The flavor text of this ability listed in different languages.
        pokemon:
          type: array
          items:
            $ref: '#/components/schemas/AbilityPokemonDetail'
          readOnly: true
          description: A list of Pokémon that could potentially have this ability.
      required:
      - effect_changes
      - effect_entries
      - flavor_text_entries
      - generation
      - id
      - name
      - names
      - pokemon
    AbilityEffectText:
      type: object
      properties:
        effect:
          type: string
          description: The localized effect text for an API resource in a specific language.
          maxLength: 6000
        short_effect:
          type: string
          description: The localized effect text in brief.
          maxLength: 300
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageSummary'
          description: The language this effect is in.
      required:
      - effect
      - language
      - short_effect
    AbilityFlavorText:
      type: object
      properties:
        flavor_text:
          type: string
          description: The localized name for an API resource in a specific language.
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageSummary'
          description: The language this text resource is in.
        version_group:
          allOf:
          - $ref: '#/components/schemas/VersionGroupSummary'
          description: The version group that uses this flavor text.
      required:
      - flavor_text
      - language
      - version_group
    AbilityName:
      type: object
      properties:
        name:
          type: string
          description: The localized name for an API resource in a specific language.
          maxLength: 200
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageSummary'
          description: The language this name is in.
      required:
      - language
      - name
    AbilityPokemonDetail:
      type: object
      properties:
        is_hidden:
          type: boolean
          description: Whether or not this a hidden ability for the referenced Pokémon.
        slot:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: Pokémon have 3 ability 'slots' which hold references to possible abilities they could have. This is
            the slot of this ability for the referenced pokemon.
        pokemon:
          allOf:
          - $ref: '#/components/schemas/PokemonSummary'
          description: The Pokémon this ability could belong to.
      required:
      - pokemon
      - slot
    AbilitySummary:
      type: object
      properties:
        name:
          type: string
          description: The name of the referenced resource.
          maxLength: 200
        url:
          type: string
          format: uri
          readOnly: true
          description: The URL of the referenced resource.
      required:
      - name
      - url
    BerryDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          description: The identifier for this resource.
        name:
          type: string
          description: The name for this resource.
          maxLength: 200
        growth_time:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: -2147483648
          description: Time it takes the tree to grow one stage, in hours. Berry trees go through four of these growth stages
            before they can be picked.
        max_harvest:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: -2147483648
          description: The maximum number of these berries that can grow on one tree in Generation IV.
        natural_gift_power:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: -2147483648
          description: The power of the move "Natural Gift" when used with this Berry.
        size:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: -2147483648
          description: The size of this Berry, in millimeters.
        smoothness:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: -2147483648
          description: The smoothness of this Berry, used in making Pokéblocks or Poffins.
        soil_dryness:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: -2147483648
          description: The speed at which this Berry dries out the soil as it grows. A higher rate means the soil dries more
            quickly.
        firmness:
          oneOf:
          - $ref: '#/components/schemas/BerryFirmnessSummary'
          - type: 'null'
          description: The firmness of this berry, used in making Pokéblocks or Poffins.
        flavors:
          type: array
          items:
            $ref: '#/components/schemas/BerryFlavorMap'
          readOnly: true
          description: A list of references to each flavor a berry can have and the potency of each of those flavors in regard
            to this berry.
        item:
          allOf:
          - $ref: '#/components/schemas/ItemSummary'
          description: Berries are actually items. This is a reference to the item specific data for this berry.
        natural_gift_type:
          oneOf:
          - $ref: '#/components/schemas/TypeSummary'
          - type: 'null'
          description: The type inherited by "Natural Gift" when used with this Berry.
      required:
      - firmness
      - flavors
      - id
      - item
      - name
      - natural_gift_type
    BerryFirmnessSummary:
      type: object
      properties:
        name:
          type: string
          description: The name of the referenced resource.
          maxLength: 200
        url:
          type: string
          format: uri
          readOnly: true
          description: The URL of the referenced resource.
      required:
      - name
      - url
    BerryFlavorMap:
      type: object
      properties:
        potency:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: How powerful the referenced flavor is for this berry.
        flavor:
          allOf:
          - $ref: '#/components/schemas/BerryFlavorSummary'
          description: The referenced berry flavor.
      required:
      - flavor
      - potency
    BerryFlavorSummary:
      type: object
      properties:
        name:
          type: string
          description: The name of the referenced resource.
          maxLength: 200
        url:
          type: string
          format: uri
          readOnly: true
          description: The URL of the referenced resource.
      required:
      - name
      - url
    BerrySummary:
      type: object
      properties:
        name:
          type: string
          description: The name of the referenced resource.
          maxLength: 200
        url:
          type: string
          format: uri
          readOnly: true
          description: The URL of the referenced resource.
      required:
      - name
      - url
    ContestEffectSummary:
      type: object
      properties:
        url:
          type: string
          format: uri
          readOnly: true
          description: The URL of the referenced resource.
      required:
      - url
    ContestTypeSummary:
      type: object
      properties:
        name:
          type: string
          description: The name of the referenced resource.
          maxLength: 200
        url:
          type: string
          format: uri
          readOnly: true
          description: The URL of the referenced resource.
      required:
      - name
      - url
    EggGroupSummary:
      type: object
      properties:
        name:
          type: string
          description: The name of the referenced resource.
          maxLength: 200
        url:
          type: string
          format: uri
          readOnly: true
          description: The URL of the referenced resource.
      required:
      - name
      - url
    EncounterConditionValueSummary:
      type: object
      properties:
        name:
          type: string
          description: The name of the referenced resource.
          maxLength: 200
        url:
          type: string
          format: uri
          readOnly: true
          description: The URL of the referenced resource.
      required:
      - name
      - url
    EncounterMethodSummary:
      type: object
      properties:
        name:
          type: string
          description: The name of the referenced resource.
          maxLength: 200
        url:
          type: string
          format: uri
          readOnly: true
          description: The URL of the referenced resource.
      required:
      - name
      - url
    EvolutionChainSummary:
      type: object
      properties:
        url:
          type: string
          format: uri
          readOnly: true
          description: The URL of the referenced resource.
      required:
      - url
    GenerationDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          description: The identifier for this resource.
        name:
          type: string
          description: The name for this resource.
          maxLength: 200
        abilities:
          type: array
          items:
            $ref: '#/components/schemas/AbilitySummary'
          readOnly: true
          description: A list of abilities that were introduced in this generation.
        main_region:
          allOf:
          - $ref: '#/components/schemas/RegionSummary'
          description: The main region travelled in this generation.
        moves:
          type: array
          items:
            $ref: '#/components/schemas/MoveSummary'
          readOnly: true
          description: A list of moves that were introduced in this generation.
        names:
          type: array
          items:
            $ref: '#/components/schemas/GenerationName'
          readOnly: true
          description: The name of this resource listed in different languages.
        pokemon_species:
          type: array
          items:
            $ref: '#/components/schemas/PokemonSpeciesSummary'
          readOnly: true
          description: A list of Pokémon species that were introduced in this generation.
        types:
          type: array
          items:
            $ref: '#/components/schemas/TypeSummary'
          readOnly: true
          description: A list of types that were introduced in this generation.
        version_groups:
          type: array
          items:
            $ref: '#/components/schemas/VersionGroupSummary'
          readOnly: true
          description: A list of version groups that were introduced in this generation.
      required:
      - abilities
      - id
      - main_region
      - moves
      - name
      - names
      - pokemon_species
      - types
      - version_groups
    GenerationName:
      type: object
      properties:
        name:
          type: string
          description: The localized name for an API resource in a specific language.
          maxLength: 200
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageSummary'
          description: The language this name is in.
      required:
      - language
      - name
    GenerationSummary:
      type: object
      properties:
        name:
          type: string
          description: The name of the referenced resource.
          maxLength: 200
        url:
          type: string
          format: uri
          readOnly: true
          description: The URL of the referenced resource.
      required:
      - name
      - url
    GrowthRateSummary:
      type: object
      properties:
        name:
          type: string
          description: The name of the referenced resource.
          maxLength: 200
        url:
          type: string
          format: uri
          readOnly: true
          description: The URL of the referenced resource.
      required:
      - name
      - url
    ItemMachine:
      type: object
      properties:
        machine:
          allOf:
          - $ref: '#/components/schemas/MachineSummary'
          description: The machine that teaches a move from an item.
        version_group:
          allOf:
          - $ref: '#/components/schemas/VersionGroupSummary'
          description: The version group of this specific machine.
      required:
      - machine
      - version_group
